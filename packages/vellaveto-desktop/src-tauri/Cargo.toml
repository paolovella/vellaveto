[package]
name = "vellaveto-desktop"
version = "7.0.0"
description = "VellaVeto Desktop — Protect your AI tools"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "vellaveto_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "vellaveto-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
