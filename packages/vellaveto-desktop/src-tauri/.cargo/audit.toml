# Cargo audit configuration for the desktop app's own lockfile.
# See https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# This file exists separately from the root `.cargo/audit.toml` on purpose.
# cargo-audit reads `.cargo/audit.toml` from its working directory only -- the
# same lockfile audited from the repository root does not pick this up -- so the
# entry below stays scoped to the desktop lockfile instead of widening the
# root workspace's advisory policy, where neither crate appears at all.
#
# The entry below is a warning, not a vulnerability, and is pinned by tauri's
# own dependency tree rather than by anything this repository declares. It
# cannot move without a tauri major bump: `src-tauri` depends on `tauri` 2 and
# it arrives transitively beneath that.
#
# `RUSTSEC-2024-0370` (`proc-macro-error` 1.0.4 is unmaintained) used to be
# listed here too. It was removed when the unmaintained class stopped blocking:
# suppressing an unmaintained crate now hides it from the dependency monitor's
# warning summary as well, which is worse than letting it be reported. Only the
# unsound entry still needs an ignore, because `-D unsound` still denies it.

[advisories]
ignore = [
  # REVIEW BY 2027-03-31: `glib` 0.18.5 has unsound `Iterator` and
  # `DoubleEndedIterator` impls for `VariantStrIter`. It comes in beneath
  # tauri's GTK stack (gtk/gdk/atk 0.18.x), which pins the 0.18 line; moving to
  # a patched `glib` requires tauri to move its GTK generation. This repository
  # does not call `VariantStrIter`.
  "RUSTSEC-2024-0429",
]
