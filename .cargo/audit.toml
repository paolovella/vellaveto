# Cargo audit configuration
# See https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# Keep advisory ignores explicit and time-bounded.
# Empty by default; add entries only when actively justified.
#
# This file is load-bearing even though `deny.toml` also checks advisories:
# cargo-audit reads it from its working directory only, which is why each
# lockfile is audited from its own directory and why the desktop app keeps its
# own `src-tauri/.cargo/audit.toml` rather than widening root policy.
#
# On the unmaintained class the two tools no longer disagree, and that is
# deliberate. `deny.toml` sets `unmaintained = "none"` and cargo-audit is not
# given `-D unmaintained`, so an unmaintained crate is REPORTED and does not
# block: the dependency monitor prints the kinds and counts every run. An
# earlier version of this comment described `unmaintained = "workspace"` as
# producing warnings that "do not hard-block builds"; it hard-blocked, because
# cargo-deny has no warn level for the class. See the comment on `unmaintained`
# in deny.toml for what changed and why.
#
# Vulnerabilities, unsoundness and yanked releases all still block in both
# tools. Entries below are vulnerability ignores and each needs a justification
# and a review date — this list is not where an unmaintained crate belongs.
ignore = [
  # REVIEW BY 2027-03-31: Advisory is on `rsa` via optional `sqlx-mysql`
  # metadata path in `sqlx` 0.8.x. Vellaveto enables only Postgres features
  # (`runtime-tokio-rustls`, `postgres`, `json`, `chrono`, `uuid`), so MySQL
  # code is not compiled in default or postgres-store builds. Upstream has no
  # patched release (Marvin attack; `rsa` lists no fixed version).
  "RUSTSEC-2023-0071",
  # REVIEW BY 2027-03-31: Transitive via optional `vellaveto-audit/zk-audit`
  # dependencies (`ark-*`). `zk-audit` is opt-in and excluded from default CI paths.
  # Upstream does not yet expose a compatible fixed release path.
  "RUSTSEC-2024-0388",
  # REVIEW BY 2027-05-31: CVE-2026-119375 in the bundled C SQLite compiled by
  # `libsqlite3-sys`. Same shape as RUSTSEC-2023-0071 above: the crate reaches
  # `Cargo.lock` through `sqlx-sqlite` 0.8.6, which `sqlx` 0.8 resolves for all
  # its backends, but only the Postgres features are enabled, so SQLite is never
  # built. Verified, not assumed: `cargo tree -i libsqlite3-sys --all-features
  # --target all` reports "did not match any packages", i.e. the crate is in the
  # lockfile but in no dependency graph, so the vulnerable C is neither compiled
  # nor shipped. The advisory's fix (>=0.39.0) is unreachable while `sqlx` 0.8
  # pins `sqlx-sqlite` 0.8.6; clearing it for real needs a `sqlx` major upgrade.
  #
  # This justification depends on `sqlx`'s `sqlite` feature staying off. Nothing
  # currently detects it being turned on -- if it is, this entry silently stops
  # being true and the CVE becomes live. A guard asserting the crate stays out of
  # the graph would be the durable fix.
  "RUSTSEC-2026-0459",
]
