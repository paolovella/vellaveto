[package]
name = "vellaveto-operator"
version = "7.0.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Kubernetes operator for Vellaveto — manages VellavetoCluster, VellavetoPolicy, and VellavetoTenant CRDs"

[[bin]]
name = "vellaveto-operator"
path = "src/main.rs"

[dependencies]
# SECURITY: floor raised to 4.2.1 for RUSTSEC-2026-0600 -- the `openssl-tls`
# connector trusted OpenSSL's default CA store in addition to the configured
# cluster CA. Not reachable here (no `openssl-tls` feature; the graph resolves
# to rustls and the lockfile has no openssl/openssl-sys), but the fix is a patch
# release, so the floor is raised rather than the advisory suppressed.
kube = { version = "5.0.0", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
