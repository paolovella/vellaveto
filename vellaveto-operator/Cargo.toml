[package]
name = "vellaveto-operator"
version = "7.0.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Kubernetes operator for Vellaveto — manages VellavetoCluster, VellavetoPolicy, and VellavetoTenant CRDs"

[[bin]]
name = "vellaveto-operator"
path = "src/main.rs"

[dependencies]
# Held at =4.0.0 deliberately. kube 4.2.0 declares rust-version 1.89.0, which
# would raise this workspace's MSRV above the 1.88.0 it promises in the root
# Cargo.toml and gates in CI. 4.0.0 is the newest 4.x that still builds on
# 1.88.0, and it already carries the serde-saphyr YAML parser, so the move off
# the deprecated serde_yaml / unsafe-libyaml pair is kept either way. Lift the
# pin when the workspace MSRV moves to 1.89 or later.
kube = { version = "=4.0.0", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
