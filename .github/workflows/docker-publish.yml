name: Docker Build & Publish

on:
  # Tag trigger removed — release.yml orchestrator handles release Docker builds.
  # Branch push kept for continuous main builds.
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/**"
      - "vellaveto-types/**"
      - "vellaveto-engine/**"
      - "vellaveto-audit/**"
      - "vellaveto-config/**"
      - "vellaveto-canonical/**"
      - "vellaveto-mcp/**"
      - "vellaveto-discovery/**"
      - "vellaveto-cluster/**"
      - "vellaveto-approval/**"
      - "vellaveto-server/**"
      - "vellaveto-proxy/**"
      - "vellaveto-http-proxy/**"
      - "vellaveto-tls/**"
      - ".github/workflows/docker-publish.yml"
      - "scripts/check-docker-defaults.sh"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "examples/**"
      - "vellaveto-types/**"
      - "vellaveto-engine/**"
      - "vellaveto-audit/**"
      - "vellaveto-config/**"
      - "vellaveto-canonical/**"
      - "vellaveto-mcp/**"
      - "vellaveto-discovery/**"
      - "vellaveto-cluster/**"
      - "vellaveto-approval/**"
      - "vellaveto-server/**"
      - "vellaveto-proxy/**"
      - "vellaveto-http-proxy/**"
      - "vellaveto-tls/**"
      - ".github/workflows/docker-publish.yml"
      - "scripts/check-docker-defaults.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check Docker secure defaults
        run: bash scripts/check-docker-defaults.sh

      - name: Check Dockerfile syntax
        run: docker build --check .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy scan results
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v3
        with:
          sarif_file: trivy-results.sarif
