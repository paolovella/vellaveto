name: Surface CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin-console/**"
      - "helm/**"
      - "packages/create-vellaveto/**"
      - "packages/vellaveto-desktop/**"
      - "site/**"
      - "terraform-provider-vellaveto/**"
      - "vscode-vellaveto/**"
      - ".github/workflows/surface-ci.yml"
      - "scripts/check-helm-secure-defaults.sh"
  pull_request:
    paths:
      - "admin-console/**"
      - "helm/**"
      - "packages/create-vellaveto/**"
      - "packages/vellaveto-desktop/**"
      - "site/**"
      - "terraform-provider-vellaveto/**"
      - "vscode-vellaveto/**"
      - ".github/workflows/surface-ci.yml"
      - "scripts/check-helm-secure-defaults.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-surfaces:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Admin Console
            directory: admin-console
            build_script: build
            lint_script: lint
            test_script: test
          - name: Create Vellaveto
            directory: packages/create-vellaveto
            build_script: build
            lint_script: ""
            test_script: ""
          - name: Desktop Web Shell
            directory: packages/vellaveto-desktop
            build_script: build
            lint_script: ""
            test_script: ""
          - name: Site
            directory: site
            build_script: build
            lint_script: ""
            test_script: ""
          - name: VS Code Extension
            directory: vscode-vellaveto
            build_script: compile
            lint_script: ""
            test_script: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts

      - name: Lint
        if: matrix.lint_script != ''
        working-directory: ${{ matrix.directory }}
        run: npm run ${{ matrix.lint_script }}

      - name: Test
        if: matrix.test_script != ''
        working-directory: ${{ matrix.directory }}
        run: npm run ${{ matrix.test_script }}

      - name: Build
        working-directory: ${{ matrix.directory }}
        run: npm run ${{ matrix.build_script }}

  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Lint chart
        run: helm lint helm/vellaveto

      - name: Validate secure chart renders
        run: bash scripts/check-helm-secure-defaults.sh

  terraform-provider:
    name: Terraform Provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider-vellaveto/go.mod
          cache-dependency-path: terraform-provider-vellaveto/go.sum

      - name: Check formatting
        working-directory: terraform-provider-vellaveto
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        working-directory: terraform-provider-vellaveto
        run: go vet ./...

      - name: Test
        working-directory: terraform-provider-vellaveto
        run: go test -v -race -count=1 ./...
