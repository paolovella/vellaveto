name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependency graph review requires GitHub Advanced Security (GHAS).
    # Fails hard on moderate+ severity and GPL/AGPL/LGPL licenses.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0,GPL-3.0,AGPL-3.0,LGPL-2.1,LGPL-3.0
          # r-efi is tri-licensed; GitHub's deny-list check flags the LGPL branch
          # even though consumers can take the permissive MIT/Apache terms.
          #
          # @img/sharp-libvips-* are prebuilt libvips binaries, LGPL-3.0-or-later.
          # This is not new exposure: the 1.2.4 set already on main carries the
          # same license. Dependency review only inspects dependencies *added* by
          # a diff, so the pre-existing copies were never examined; bumping them
          # to 1.3.2 re-presents them as additions and trips the deny-list.
          # They are build-time only -- astro uses sharp for image optimization
          # during `astro build`, and the binaries are not redistributed in the
          # static site output. sharp itself is Apache-2.0.
          # Pinned by exact version so a future bump is reviewed again.
          #
          # Kept on one line deliberately: a YAML folded block (>-) inserts a
          # space after each newline, and the action's list is comma-separated,
          # so folding would yield entries with a leading space that may not
          # match. Do not reformat this into a multi-line block.
          allow-dependencies-licenses: pkg:cargo/r-efi@6.0.0,pkg:npm/%40img/sharp-libvips-darwin-arm64@1.3.2,pkg:npm/%40img/sharp-libvips-darwin-x64@1.3.2,pkg:npm/%40img/sharp-libvips-linux-arm@1.3.2,pkg:npm/%40img/sharp-libvips-linux-arm64@1.3.2,pkg:npm/%40img/sharp-libvips-linux-ppc64@1.3.2,pkg:npm/%40img/sharp-libvips-linux-riscv64@1.3.2,pkg:npm/%40img/sharp-libvips-linux-s390x@1.3.2,pkg:npm/%40img/sharp-libvips-linux-x64@1.3.2,pkg:npm/%40img/sharp-libvips-linuxmusl-arm64@1.3.2,pkg:npm/%40img/sharp-libvips-linuxmusl-x64@1.3.2
          comment-summary-in-pr: always
