name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "sdk/**"
      - "helm/**"
      - "*.md"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "sdk/**"
      - "helm/**"
      - "*.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: 0

jobs:
  # ───────────────────────────────────────────────────────
  # 0. Validate external tool fingerprints
  # ───────────────────────────────────────────────────────
  actionlint-checksum:
    name: Validate actionlint digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate release checksum
        run: |
          set -euo pipefail
          source tools/actionlint-release.env
          ACTIONLINT_VERSION=${ACTIONLINT_VERSION:?}
          ACTIONLINT_SHA256=${ACTIONLINT_SHA256:?}
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint.tgz "$URL"
          SHA=$(sha256sum /tmp/actionlint.tgz | awk '{print $1}')
          if [ "$SHA" != "$ACTIONLINT_SHA256" ]; then
            echo "::error::actionlint checksum mismatch for version ${ACTIONLINT_VERSION}"
            exit 1
          fi

  # ───────────────────────────────────────────────────────
  # 1. Fast checks: format, lint, compile
  # ───────────────────────────────────────────────────────
  check:
    name: Check & Lint
    needs: actionlint-checksum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install actionlint
        run: |
          set -euo pipefail
          source tools/actionlint-release.env
          ACTIONLINT_VERSION=${ACTIONLINT_VERSION:?}
          ACTIONLINT_SHA256=${ACTIONLINT_SHA256:?}
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tgz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint GitHub workflows
        run: actionlint .github/workflows/*.yml

      - name: Shellcheck install.sh
        run: shellcheck --shell=sh --severity=warning scripts/install.sh

      - name: Shellcheck quality scripts
        run: |
          shellcheck --shell=bash --severity=warning \
            scripts/check-cargo-install-pins.sh \
            scripts/check-cargo-duplicates.sh \
            scripts/check-docker-defaults.sh \
            scripts/check-helm-secure-defaults.sh \
            scripts/check-npm-package.sh \
            scripts/check-openapi-routes.sh \
            scripts/check-python-package.sh \
            scripts/check-claim-anchors.sh \
            scripts/generate-evidence-manifest.sh \
            scripts/report-formal-tooling.sh \
            scripts/run-dependency-monitor.sh \
            scripts/clippy.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Verify lockfile immutability
        run: |
          cargo metadata --locked --format-version=1 > /dev/null
          git diff --exit-code -- Cargo.lock

      - name: Check cargo install pins
        run: bash scripts/check-cargo-install-pins.sh

      - name: Check Docker secure defaults
        run: bash scripts/check-docker-defaults.sh

      - name: Check duplicate crate baseline
        run: bash scripts/check-cargo-duplicates.sh

      - name: Guard zk-audit feature stays opt-in
        run: |
          set -euo pipefail
          if cargo tree --workspace --locked -e features | rg -q 'vellaveto-audit feature "zk-audit"'; then
            echo "::error::vellaveto-audit/zk-audit must not be enabled by default."
            exit 1
          fi

      - name: Check
        run: cargo check --workspace --all-targets --locked

      # Default features only — this is the fast per-push gate. Non-default
      # features are linted by the feature-matrix job, which is where the
      # heavier dependency trees belong.
      - name: Clippy
        run: bash scripts/clippy.sh --workspace --all-targets --locked

      - name: Reject unwrap()/expect() in library code
        run: |
          # Scan library source for .unwrap() and .expect() calls.
          # Excludes: main.rs, tests.rs, *_tests.rs (test modules),
          # kani_proofs.rs (Kani harnesses gated behind #[cfg(kani)]),
          # #[cfg(test)] blocks, and doc comments (//! and ///).
          # shellcheck disable=SC2016
          HITS=$(find vellaveto-*/src/ -name '*.rs' -not -name 'main.rs' -not -name 'tests.rs' -not -name '*_tests.rs' -not -name 'kani_proofs.rs' -print0 \
            | xargs -0 awk 'FNR==1 { skip=0 }
              /^[[:space:]]*#\[cfg\(test\)\]/ { skip=1 }
              /^[[:space:]]*#\[cfg\(all\(test,/ { skip=1 }
              skip==0 && /^[[:space:]]*(\/\/!|\/\/\/)/ { next }
              skip==0 && /\.unwrap\(\)/ { printf "%s:%d: %s\n", FILENAME, FNR, $0; found=1 }
              skip==0 && /\.expect\(/ { printf "%s:%d: %s\n", FILENAME, FNR, $0; found=1 }
              END { exit found ? 1 : 0 }' 2>&1) || {
            echo "::error::Found unwrap()/expect() in library code (see below)"
            echo "$HITS"
            exit 1
          }

      - name: Reject panic! in library code
        run: |
          # Scan library source for panic! in non-test code paths.
          # Excludes: main.rs, tests.rs, *_tests.rs, kani_proofs.rs
          # (Kani harnesses use panic! for assertion and are gated
          # behind #[cfg(kani)]), #[cfg(test)] sections, and comments.
          # shellcheck disable=SC2016
          HITS=$(find vellaveto-*/src/ -name '*.rs' -not -name 'main.rs' -not -name 'tests.rs' -not -name '*_tests.rs' -not -name 'kani_proofs.rs' -print0 \
            | xargs -0 awk 'FNR==1 { skip=0 }
              /^[[:space:]]*#\[cfg\(test\)\]/ { skip=1 }
              /^[[:space:]]*#\[cfg\(all\(test,/ { skip=1 }
              skip==0 && /^[[:space:]]*\/\// { next }
              skip==0 && /panic!\(/ { printf "%s:%d: %s\n", FILENAME, FNR, $0; found=1 }
              END { exit found ? 1 : 0 }' 2>&1) || {
            echo "::error::Found panic! in library code (see below)"
            echo "$HITS"
            exit 1
          }

      - name: Reject unwrap()/expect()/panic! in build.rs
        run: |
          # Treat build scripts like runtime code: no panic-prone helpers.
          # shellcheck disable=SC2016
          HITS=$(find vellaveto-*/ -maxdepth 1 -name 'build.rs' -print0 \
            | xargs -0 -r awk '
              /^[[:space:]]*\/\// { next }
              /\.unwrap\(\)/ { printf "%s:%d: %s\n", FILENAME, FNR, $0; found=1 }
              /\.expect\(/ { printf "%s:%d: %s\n", FILENAME, FNR, $0; found=1 }
              /panic!\(/ { printf "%s:%d: %s\n", FILENAME, FNR, $0; found=1 }
              END { exit found ? 1 : 0 }' 2>&1) || {
            echo "::error::Found unwrap()/expect()/panic! in build.rs (see below)"
            echo "$HITS"
            exit 1
          }

      - name: Require SPDX license headers
        run: |
          MISSING=$(find vellaveto-*/src/ -name '*.rs' -print0 \
            | xargs -0 grep -rL 'SPDX-License-Identifier' || true)
          if [ -n "$MISSING" ]; then
            echo "::error::Files missing SPDX-License-Identifier header:"
            echo "$MISSING"
            exit 1
          fi

      - name: Check OpenAPI route coverage
        run: bash scripts/check-openapi-routes.sh

  # ───────────────────────────────────────────────────────
  # 2. Vellaveto types contract gate
  # ───────────────────────────────────────────────────────
  vellaveto-types-contract:
    name: Vellaveto Types Contract Gate
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Detect vellaveto-types contract-impacting changes
        id: contract_changes
        run: |
          set -euo pipefail
          ZERO_SHA=0000000000000000000000000000000000000000
          BASE_SHA=

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            echo "No usable base SHA found; running contract checks."
            echo "run_contract=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" || true)"
          echo "Changed files between $BASE_SHA and ${{ github.sha }}:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -Eq '^(vellaveto-types/|Cargo\.toml$|Cargo\.lock$)'; then
            echo "run_contract=true" >> "$GITHUB_OUTPUT"
            echo "vellaveto-types contract-impacting files changed."
          else
            echo "run_contract=false" >> "$GITHUB_OUTPUT"
            echo "No vellaveto-types contract-impacting changes detected."
          fi

      - name: Run vellaveto-types contract checks
        if: steps.contract_changes.outputs.run_contract == 'true'
        run: |
          cargo test -p vellaveto-types --locked
          cargo test -p vellaveto-engine --locked
          cargo test -p vellaveto-config --locked
          cargo test -p vellaveto-mcp --locked
          cargo test -p vellaveto-server --locked
          cargo test -p vellaveto-http-proxy --locked
          cargo test -p vellaveto-integration --locked

      - name: Vellaveto-types contract checks skipped
        if: steps.contract_changes.outputs.run_contract != 'true'
        run: echo "Skipping vellaveto-types contract checks."

  # ───────────────────────────────────────────────────────
  # 3. Full test suite
  # ───────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Run tests
        run: cargo test --workspace --no-fail-fast --locked

      - name: Build docs (verify no broken links)
        run: cargo doc --workspace --no-deps --locked

  # The former "Feature Gates" job (a2a, redis-backend) has been folded into
  # the feature-matrix job below, so every feature is listed in one place.

  # ───────────────────────────────────────────────────────
  # 5. Security audit
  # ───────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      # Pinned and --locked, matching cargo-deny / cargo-vet /
      # cargo-semver-checks / cargo-fuzz elsewhere in this file.
      #
      # This replaced rustsec/audit-check, which ran an unpinned, unlocked
      # `cargo install cargo-audit`. That re-resolved cargo-audit's own
      # dependencies to whatever was newest, so when tinyvec 1.13.0 shipped
      # broken ("cannot find macro `vec` in this scope") the install failed and
      # this job stopped auditing anything — with no change to this repository.
      # `--locked` builds cargo-audit against its own published lockfile, so a
      # third-party release can no longer break this check.
      #
      # Trade-off: the action posted advisories as check annotations; a bare
      # `cargo audit` fails the job with the advisory text in the log instead.
      # Plainer, but a check that cannot build is worth less than a plain one.
      # No GITHUB_TOKEN or `checks: write` needed as a result.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check for security advisories
        run: cargo audit

  # ───────────────────────────────────────────────────────
  # 6. Fuzz target compilation check
  # ───────────────────────────────────────────────────────
  fuzz:
    name: Fuzz Targets Compile
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          # Pinned: an unpinned `nightly` lets this job break with no code
          # change. It did — nightly deprecated `Atomic::fetch_update` in
          # favour of `try_update`, and the workflow-level RUSTFLAGS
          # `-Dwarnings` turns that into a hard error. We cannot do the
          # rename while MSRV is 1.88.0, because `try_update` is still
          # unstable there (`atomic_try_update`). Last verified-good
          # nightly is 2026-06-01; 2026-07-10 already fails.
          # Revisit when MSRV moves past the `try_update` stabilisation.
          toolchain: nightly-2026-06-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz -> target
          cache-on-failure: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      # --locked against the committed fuzz/Cargo.lock. `fuzz` is excluded from
      # the workspace (root Cargo.toml), so it does not share the root lockfile
      # and, without one of its own, re-resolved every dependency on every run.
      # That is how tinyvec 1.13.0 — published broken — reached this job and
      # failed it with no change to this repository. Same lesson as the pinned
      # toolchain above, one layer down: pin the tool AND the code's deps.
      - name: Check fuzz targets compile
        working-directory: fuzz
        run: cargo +nightly-2026-06-01 check --all-targets --locked

  # ───────────────────────────────────────────────────────
  # 7. Benchmark regression gate (push to main only)
  # ───────────────────────────────────────────────────────
  bench:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Restore benchmark baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/criterion
          key: bench-baseline-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: bench-baseline-${{ runner.os }}-

      - name: Run benchmarks
        run: |
          set -euo pipefail
          # CI smoke benchmark mode: run Criterion targets directly to avoid
          # forwarding `--quick` to non-Criterion test harnesses.
          run_bench() {
            local pkg="$1"
            local bench="$2"
            cargo bench -p "$pkg" --bench "$bench" --locked -- --quick || {
              echo "First benchmark run failed for ${pkg}/${bench}; retrying once..."
              cargo bench -p "$pkg" --bench "$bench" --locked -- --quick
            }
          }

          run_bench_with_features() {
            local pkg="$1"
            local bench="$2"
            local features="$3"
            cargo bench -p "$pkg" --bench "$bench" --features "$features" --locked -- --quick || {
              echo "First benchmark run failed for ${pkg}/${bench} (features=${features}); retrying once..."
              cargo bench -p "$pkg" --bench "$bench" --features "$features" --locked -- --quick
            }
          }

          run_bench vellaveto-audit audit
          run_bench vellaveto-engine evaluation
          run_bench vellaveto-engine e2e_pipeline
          run_bench vellaveto-http-proxy http_proxy
          run_bench vellaveto-mcp inspection
          run_bench vellaveto-mcp rug_pull
          run_bench_with_features vellaveto-mcp semantic semantic-detection

      - name: Save benchmark baseline
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/criterion
          key: bench-baseline-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

  # ───────────────────────────────────────────────────────
  # 7. Release build (verify LTO and stripped binary)
  # ───────────────────────────────────────────────────────
  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Check binary sizes
        run: |
          set -euo pipefail
          bins=(
            target/release/vellaveto
            target/release/vellaveto-proxy
            target/release/vellaveto-http-proxy
          )

          echo "=== Release binary sizes ==="
          ls -lh "${bins[@]}"

          # Fail if any binary exceeds 50MB (signal of accidental debug info or bloat)
          max_bytes=$((50 * 1024 * 1024))
          for bin in "${bins[@]}"; do
            if [ ! -f "$bin" ]; then
              echo "::error::Expected release binary missing: $bin"
              exit 1
            fi

            size=$(stat --printf="%s" "$bin")
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::$bin is $((size / 1024 / 1024))MB — exceeds 50MB limit"
              exit 1
            fi

            echo "$bin: $((size / 1024 / 1024))MB — OK"
          done

  # ───────────────────────────────────────────────────────
  # 8. Supply chain audit (cargo-vet policy)
  # ───────────────────────────────────────────────────────
  supply-chain-audit:
    name: Supply Chain Audit (cargo-vet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install cargo-vet
        run: cargo install cargo-vet --version 0.10.2 --locked

      - name: Run cargo-vet policy
        run: cargo vet --locked

  # ───────────────────────────────────────────────────────
  # 9. Semver compatibility check (PR only)
  # ───────────────────────────────────────────────────────
  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # No workspace crates are published to crates.io yet
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Detect semver-relevant Rust API changes
        id: semver_changes
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          if [ -z "$BASE_SHA" ]; then
            echo "No PR base SHA available; running semver checks."
            echo "run_semver=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" || true)"
          echo "Changed files between $BASE_SHA and ${{ github.sha }}:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -Eq '^(vellaveto-[^/]+/(src/.*\.rs|build\.rs))$'; then
            echo "run_semver=true" >> "$GITHUB_OUTPUT"
            echo "Crate Rust sources changed; running semver checks."
          else
            echo "run_semver=false" >> "$GITHUB_OUTPUT"
            echo "No crate Rust source or build script changes detected; skipping semver checks."
          fi

      - name: Install protobuf compiler
        if: steps.semver_changes.outputs.run_semver == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Install cargo-semver-checks
        if: steps.semver_changes.outputs.run_semver == 'true'
        run: cargo install cargo-semver-checks --version 0.48.0 --locked

      - name: Check for semver violations
        if: steps.semver_changes.outputs.run_semver == 'true'
        # vellaveto-http-proxy is excluded because its published baseline cannot
        # be built, so cargo-semver-checks aborts the entire run before reaching
        # the other crates:
        #
        #   Failed to compile MCP protobuf schema: protoc failed:
        #   Could not make proto path relative: ../proto/mcp/v1/mcp.proto:
        #   No such file or directory
        #
        # build.rs references ../proto/, which is outside the crate directory,
        # and crates.io packages only files inside it. `cargo package --list`
        # for this crate emits build.rs and no .proto at all, so every published
        # version is unbuildable by a consumer.
        #
        # Excluding it is not a workaround for a violation in this crate -- it
        # has none. It is unreachable, and no change to current code can fix a
        # baseline that is already published and immutable. The exclusion can be
        # removed once a version with the proto actually packaged has been
        # published to crates.io and becomes the baseline.
        run: cargo semver-checks check-release --exclude mcpsec --exclude vellaveto-http-proxy

      - name: Semver check skipped
        if: steps.semver_changes.outputs.run_semver != 'true'
        run: echo "Skipping semver checks."

  # ───────────────────────────────────────────────────────
  # 10a. Coq formal verification
  # ───────────────────────────────────────────────────────
  coq-verification:
    name: Coq Formal Proofs
    runs-on: ubuntu-latest
    # 30, matching the `coq` job in formal-verification.yml, which installs the
    # same package and builds the same proofs. `apt-get install coq` pulls
    # 288 MB of archives (~1 GB installed), and when the Ubuntu mirror is slow
    # that alone can consume a whole 10-minute budget: on #370 the install ran
    # 07:09:26 -> 07:19:26 and the job was cancelled on timeout before a single
    # proof was built, while the 30-minute job on the same commit passed. The
    # proofs take seconds; the download does not.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Coq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends coq

      - name: Build Coq proofs
        working-directory: formal/coq
        run: make

      - name: Reject Admitted/admit in proofs
        run: |
          set -euo pipefail
          HITS=$(grep -rn 'Admitted\|[^a-zA-Z]admit[^a-zA-Z]\|[^a-zA-Z]admit$' formal/coq/Vellaveto/*.v || true)
          if [ -n "$HITS" ]; then
            echo "::error::Found Admitted/admit in Coq proofs (incomplete proofs):"
            echo "$HITS"
            exit 1
          fi
          echo "All Coq proofs complete — no Admitted/admit found."

  # ───────────────────────────────────────────────────────
  # 10. MSRV check (minimum supported Rust version)
  # ───────────────────────────────────────────────────────
  msrv-check:
    name: MSRV (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace --locked

  # ───────────────────────────────────────────────────────
  # 11. Feature flag matrix testing
  # ───────────────────────────────────────────────────────
  feature-matrix:
    name: "Features: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_args: "--workspace --locked"
          - name: discovery only
            cargo_args: "-p vellaveto-server --no-default-features --features discovery --locked"
          - name: projector only
            cargo_args: "-p vellaveto-server --no-default-features --features projector --locked"
          - name: zk-audit
            cargo_args: "-p vellaveto-audit --features zk-audit --locked"
          # grpc gates ~10,900 lines of transport code in vellaveto-http-proxy
          # (proxy/mod.rs) that no other job compiles, tests included.
          - name: grpc
            cargo_args: "-p vellaveto-http-proxy --features grpc --locked"
          # The server feature pulls in vellaveto-audit/postgres-store too.
          - name: postgres-store
            cargo_args: "-p vellaveto-server --features postgres-store --locked"
          # Folded in from the former "Feature Gates" job.
          - name: a2a
            cargo_args: "-p vellaveto-mcp --features a2a --locked"
          - name: redis-backend
            cargo_args: "-p vellaveto-server --features redis-backend --locked"
          # Per-crate --all-features, so a lint or a break is attributed to one
          # crate rather than surfacing only in the workspace-wide entry.
          - name: audit all features
            cargo_args: "-p vellaveto-audit --all-features --locked"
          - name: mcp all features
            cargo_args: "-p vellaveto-mcp --all-features --locked"
          - name: server all features
            cargo_args: "-p vellaveto-server --all-features --locked"
          # The catch-all: a feature added later is covered here on day one,
          # even if nobody remembers to add a row above.
          - name: workspace all features
            cargo_args: "--workspace --all-features --locked"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      # Required by the `grpc` entries: vellaveto-http-proxy's build.rs compiles
      # proto/mcp/v1/mcp.proto via prost, which shells out to protoc. Installed
      # unconditionally rather than per-entry because `workspace all features`
      # enables grpc too, and a matrix entry added later would silently need it.
      # Nothing needed protoc before, since no job ever compiled grpc — which is
      # the gap this job exists to close.
      - name: Install protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      # Clippy runs before the tests: this job used to run `cargo test` only,
      # so lints behind a non-default feature were never checked anywhere —
      # zk-audit was in this matrix and still accumulated a finding.
      - name: "Clippy: ${{ matrix.name }}"
        run: bash scripts/clippy.sh ${{ matrix.cargo_args }} --all-targets

      - name: "Test: ${{ matrix.name }}"
        run: cargo test ${{ matrix.cargo_args }}
