name: Coverage

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "sdk/**"
      - "helm/**"
      - "*.md"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "sdk/**"
      - "helm/**"
      - "*.md"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Baseline for the cargo-llvm-cov `Lines` column; raise this ratchet when
  # line coverage improves.
  MIN_LINE_COVERAGE: 77

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          # Pinned for the same reason as the fuzz job in ci.yml — see the
          # comment there. Keep these toolchain pins in sync.
          toolchain: nightly-2026-06-01
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          cache-targets: false

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Generate coverage summary
        run: cargo +nightly-2026-06-01 llvm-cov --workspace --locked --summary-only --fail-under-lines "$MIN_LINE_COVERAGE"

      - name: Generate LCOV report
        run: cargo +nightly-2026-06-01 llvm-cov report --lcov --output-path lcov.info

      - name: Upload to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
