name: Fuzz CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "sdk/**"
      - "helm/**"
      - "*.md"
      - "**/*.md"
  schedule:
    - cron: "0 4 * * 1" # Weekly on Monday at 04:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: "Fuzz: ${{ matrix.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          # Core security paths
          - fuzz_injection_detection
          - fuzz_normalize_path
          - fuzz_extract_domain
          - fuzz_dlp_decoding
          - fuzz_policy_compilation
          # Crypto & identity
          - fuzz_etdi_signature
          - fuzz_attestation_verify
          # Protocol parsing
          - fuzz_grpc_proto
          - fuzz_json_rpc_framing
          - fuzz_ws_frame
          # Resilience
          - fuzz_circuit_breaker
          - fuzz_cidr_parsing
          # Input normalization
          - fuzz_homoglyph
          - fuzz_scan_params
          - fuzz_output_validation
          # A2A / agent card
          - fuzz_agent_card_parse
          - fuzz_agent_card_url
          - fuzz_a2a_classify
          # Message classification & similarity
          - fuzz_classify_message
          - fuzz_semantic_similarity
          # Schema & tasks
          - fuzz_schema_lineage
          - fuzz_async_tasks
          # Multimodal metadata
          - fuzz_audio_metadata
          - fuzz_video_metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          # Pinned for the same reason as the fuzz job in ci.yml — see the
          # comment there. Keep these two toolchain pins in sync.
          toolchain: nightly-2026-06-01

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz -> target
          cache-on-failure: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: "Run fuzzer: ${{ matrix.target }}"
        working-directory: fuzz
        run: cargo +nightly-2026-06-01 fuzz run ${{ matrix.target }} -- -max_total_time=30

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
