name: Provenance and SBOM

on:
  # No longer triggers on tags — release.yml orchestrator handles provenance.
  # Keep workflow_dispatch for manual re-runs if needed.
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance-and-sbom:
    name: Build Provenance and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Verify lockfile immutability
        run: |
          cargo metadata --locked --format-version=1 > /dev/null
          git diff --exit-code -- Cargo.lock

      - name: Build release artifacts
        run: cargo build --release --workspace --locked

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vellaveto-sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Attest release binaries provenance
        if: ${{ github.event.repository.private == false || vars.ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/vellaveto
            target/release/vellaveto-proxy
            target/release/vellaveto-http-proxy
            target/release/vellaveto-shield

      - name: Skip attestation on private repositories
        if: ${{ github.event.repository.private == true && vars.ENABLE_ATTESTATIONS != 'true' }}
        run: |
          echo "Attestations are unavailable for private user-owned repositories."
          echo "Set ENABLE_ATTESTATIONS=true once repository settings support this feature."

      - name: Verify provenance attestations
        if: ${{ github.event.repository.private == false || vars.ENABLE_ATTESTATIONS == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in \
            target/release/vellaveto \
            target/release/vellaveto-proxy \
            target/release/vellaveto-http-proxy \
            target/release/vellaveto-shield; do
            if [ ! -f "$artifact" ]; then
              echo "::error::Expected build artifact missing: $artifact"
              exit 1
            fi
            gh attestation verify "$artifact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/provenance-sbom.yml" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners \
              >/dev/null
          done
