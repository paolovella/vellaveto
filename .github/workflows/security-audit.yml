name: Security Audit

on:
  # Also run on dependency changes. A yanked crate is only visible to a tool
  # that refreshes the crates.io index, and the weekly schedule below was the
  # only such gate — `wnaf 0.14.0` being yanked went unnoticed for four months
  # because a scheduled red never appears on a pull request.
  pull_request:
    paths:
      # The root pair is listed separately on purpose: `**` matches zero or more
      # of any character, so `**/Cargo.lock` still requires a literal `/` and
      # would not match the root lockfile — the one this gate exists for.
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      # This workflow and the advisory-ignore configs it honours. Without these
      # a change to the gate itself does not run the gate: the first revision of
      # this PR edited the audit step and `Security Audit` never fired, so the
      # change went in unexercised. `surface-ci.yml` already lists itself for
      # the same reason.
      - '.github/workflows/security-audit.yml'
      - '**/.cargo/audit.toml'
      - '.cargo/audit.toml'
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec-audit:
    name: RustSec Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Verify lockfiles
        run: |
          set -u
          rc=0
          for d in . fuzz packages/vellaveto-desktop/src-tauri; do
            (cd "$d" && cargo metadata --locked --format-version=1 > /dev/null) || rc=1
          done
          exit $rc
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # Audit every lockfile, not just the root one. `cargo audit` reads only
      # the lockfile it is pointed at, and this repository has three, so for as
      # long as this step ran bare at the repository root the desktop app (435
      # dependencies, shipped) and the fuzz workspace (394) were scanned by
      # nothing. That hid two CVSS 7.5 advisories in `quick-xml` and one in
      # `rustls`.
      #
      # Each lockfile is audited from its own directory rather than with `-f`
      # from the root, because cargo-audit reads `.cargo/audit.toml` from its
      # working directory only. That keeps the desktop app's tauri-pinned
      # unsound ignore scoped to its own lockfile instead of widening root
      # policy -- see src-tauri/.cargo/audit.toml. It held two entries until the
      # unmaintained class stopped blocking; the unmaintained one was dropped
      # then, so that crate is reported rather than suppressed.
      #
      # The loop runs all three and fails if any fail, so one run reports the
      # whole picture instead of stopping at the first bad lockfile.
      #
      # Caveat for anyone reading a green run: cargo-audit's yanked-crate check
      # FAILS OPEN. When the crates.io index is unreachable it prints
      # "couldn't check if the package is yanked" and still exits 0, so a pass
      # proves the advisory scan ran, not that the yanked scan did.
      # The deny set is granular rather than `-D warnings`, which denies every
      # warning class at once. Vulnerabilities always fail cargo-audit on their
      # own exit status; `unsound` and `yanked` are denied here on purpose; the
      # `unmaintained` class is deliberately NOT, because it is reported instead
      # of blocking -- see the comment on `unmaintained` in deny.toml, and the
      # per-run summary the dependency monitor prints.
      #
      # RUSTSEC-2026-0543 (chrono is unmaintained, no fixed version exists,
      # direct workspace dependency of ten crates) is what made the difference
      # matter: with `-D warnings` it failed all three trees here while plain
      # `cargo audit` passed them, so two gates in this repository disagreed
      # about whether an abandoned release cadence is a security failure.
      # `-D warnings` would also start blocking on the next unmaintained crate
      # anywhere in 650 dependencies, which is not a decision a transitive
      # author gets to make for this repository.
      - name: Run cargo audit
        run: |
          set -u
          rc=0
          for d in . fuzz packages/vellaveto-desktop/src-tauri; do
            echo "::group::cargo audit ($d)"
            (cd "$d" && cargo audit -D unsound -D yanked) || rc=1
            echo "::endgroup::"
          done
          exit $rc
