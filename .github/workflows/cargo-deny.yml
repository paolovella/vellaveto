name: Cargo Deny

on:
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 06:45 UTC
    - cron: "45 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Verify lockfile
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Check duplicate crate baseline
        run: bash scripts/check-cargo-duplicates.sh

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked

      # Check every tree with its own lockfile, not just the root one. `fuzz` is
      # excluded from the root workspace (root Cargo.toml), so a root-only run
      # never saw its dependencies -- that is how libfuzzer-sys's mandatory NCSA
      # term went unreviewed. Same reasoning, and the same `cd` rather than
      # `--manifest-path`, as the cargo-audit loop in security-audit.yml: each
      # tree resolves config and lockfile from its own directory. Both trees
      # share the root deny.toml, since neither `fuzz` nor the root has a
      # per-tree config.
      #
      # Accumulate rc instead of failing on the first tree, so one run reports
      # every tree rather than hiding later ones behind the first failure.
      - name: Run cargo-deny checks
        run: |
          set -u
          rc=0
          for d in . fuzz; do
            echo "::group::cargo-deny: ${d}"
            (cd "$d" && cargo deny --locked check -A duplicate advisories bans sources licenses) || rc=1
            echo "::endgroup::"
          done
          exit $rc
