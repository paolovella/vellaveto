# Runs rust-clippy and uploads results as SARIF to GitHub Code Scanning.

name: rust-clippy analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '39 1 * * 0'

permissions: {}

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install required cargo tools
        run: |
          cargo install clippy-sarif --version 0.8.0 --locked
          cargo install sarif-fmt --version 0.8.0 --locked

      # Required by --all-features below: it enables `grpc`, so
      # vellaveto-http-proxy's build.rs compiles proto/mcp/v1/mcp.proto via
      # prost, which shells out to protoc. Without this the build script dies
      # ("Could not find `protoc`") before clippy lints anything — and because
      # the clippy step is continue-on-error, the run still uploads a SARIF,
      # one built from compiler errors rather than lints. ci.yml installs
      # protoc for the same reason.
      - name: Install protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Run rust-clippy
        id: clippy
        run: |
          set -o pipefail
          # --all-features so the security dashboard covers feature-gated code
          # too; without it the SARIF report silently omits whole modules.
          bash scripts/clippy.sh \
            --workspace \
            --all-targets \
            --all-features \
            --locked \
            --message-format=json \
            | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

      - name: Fail on clippy policy violations
        if: steps.clippy.outcome == 'failure'
        run: exit 1
