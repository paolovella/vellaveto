# Runs rust-clippy and uploads results as SARIF to GitHub Code Scanning.

name: rust-clippy analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '39 1 * * 0'

permissions: {}

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install required cargo tools
        run: |
          cargo install clippy-sarif --version 0.8.0 --locked
          cargo install sarif-fmt --version 0.8.0 --locked

      - name: Run rust-clippy
        id: clippy
        run: |
          set -o pipefail
          # --all-features so the security dashboard covers feature-gated code
          # too; without it the SARIF report silently omits whole modules.
          cargo clippy \
            --workspace \
            --all-targets \
            --all-features \
            --locked \
            --message-format=json \
            -- $(bash scripts/clippy-flags.sh) \
            | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

      - name: Fail on clippy policy violations
        if: steps.clippy.outcome == 'failure'
        run: exit 1
