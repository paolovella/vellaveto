name: Release

# Tags are OUTPUT, not INPUT. This workflow is the single orchestrator.
# Usage: gh workflow run release.yml -f version=6.0.10
#
# Flow: preflight → build → publish (npm/pypi/maven/docker) → tag + GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 6.0.10)"
        required: true
        type: string
      dry_run:
        description: "Dry run — build and test but skip publishing"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Phase 1: Pre-flight validation
  # ──────────────────────────────────────────────
  preflight:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected: X.Y.Z)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists. Use a new version."
            exit 1
          fi

      - name: Check version alignment (all 33 files)
        run: scripts/check-versions.sh "${{ inputs.version }}"

      - name: Verify lockfile immutability
        run: |
          cargo metadata --locked --format-version=1 > /dev/null
          git diff --exit-code -- Cargo.lock

      - name: Check cargo install pins
        run: bash scripts/check-cargo-install-pins.sh

      - name: Check Docker secure defaults
        run: bash scripts/check-docker-defaults.sh

      - name: Check duplicate crate baseline
        run: bash scripts/check-cargo-duplicates.sh

      - name: Check OpenAPI route coverage
        run: bash scripts/check-openapi-routes.sh

      - name: Install cargo-vet
        run: cargo install cargo-vet --version 0.10.2 --locked

      - name: Run cargo-vet policy
        run: cargo vet --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace --all-targets --locked

      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -D unsafe-code -A clippy::uninlined_format_args -A clippy::field_reassign_with_default -A clippy::const_is_empty -A clippy::unnecessary_literal_unwrap -A clippy::assertions_on_constants
        env:
          RUSTFLAGS: -Dwarnings

      - name: Run full test suite
        run: cargo test --workspace --no-fail-fast --locked

      - name: unwrap/expect scanner
        run: |
          # shellcheck disable=SC2016
          find vellaveto-*/src/ -name '*.rs' \
            -not -name 'main.rs' -not -name 'tests.rs' -not -name '*_tests.rs' \
            -print0 | xargs -0 awk '
            FNR==1 { skip=0 }
            /^[[:space:]]*#\[cfg\(test\)\]/ { skip=1 }
            /^[[:space:]]*#\[cfg\(all\(test,/ { skip=1 }
            skip==0 && /^[[:space:]]*(\/\/!|\/\/\/)/ { next }
            skip==0 && /\.unwrap\(\)/ { printf "%s:%d: %s\n", FILENAME, FNR, $0; found=1 }
            skip==0 && /\.expect\(/ { printf "%s:%d: %s\n", FILENAME, FNR, $0; found=1 }
            END { exit found ? 1 : 0 }'

      - name: Verify CHANGELOG has version section
        run: |
          if ! grep -q "^\## \[${{ inputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing [${{ inputs.version }}] section"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Phase 2: Build release binaries (4 platforms)
  # ──────────────────────────────────────────────
  build:
    name: "Build (${{ matrix.target }})"
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
            cross: false
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
            cross: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Install cross-compilation tools (Linux aarch64)
        if: ${{ matrix.cross }}
        # SECURITY (R257-CI-1): Pin cross to a specific version from crates.io
        # to prevent supply-chain attacks via unpinned git installs.
        run: cargo install cross --version 0.2.5 --locked

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}

      - name: Build release binaries (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binaries (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Validate release binaries
        run: |
          for bin in vellaveto vellaveto-http-proxy vellaveto-proxy vellaveto-shield; do
            path="target/${{ matrix.target }}/release/$bin"
            if [ ! -x "$path" ]; then
              echo "::error::Required release binary missing or not executable: $path"
              exit 1
            fi
          done

      - name: Strip binaries (Linux)
        if: ${{ contains(matrix.target, 'linux') && !matrix.cross }}
        run: |
          for bin in vellaveto vellaveto-http-proxy vellaveto-proxy vellaveto-shield; do
            strip "target/${{ matrix.target }}/release/$bin" 2>/dev/null || true
          done

      - name: Strip binaries (Linux cross)
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          for bin in vellaveto vellaveto-http-proxy vellaveto-proxy vellaveto-shield; do
            aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/$bin" 2>/dev/null || true
          done

      - name: Strip binaries (macOS)
        if: ${{ contains(matrix.target, 'apple') }}
        run: |
          for bin in vellaveto vellaveto-http-proxy vellaveto-proxy vellaveto-shield; do
            strip "target/${{ matrix.target }}/release/$bin" 2>/dev/null || true
          done

      - name: Create release archive
        run: |
          VERSION="${{ inputs.version }}"
          rm -rf release
          mkdir -p release
          for bin in vellaveto vellaveto-http-proxy vellaveto-proxy vellaveto-shield; do
            cp "target/${{ matrix.target }}/release/$bin" "release/"
          done
          cp LICENSE LICENSING.md NOTICE README.md CHANGELOG.md release/
          cp -r examples/ release/examples/
          tar czf "vellaveto-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}" -C release .

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: vellaveto-*-${{ matrix.target }}.*
          retention-days: 1

  # ──────────────────────────────────────────────
  # Phase 3: Publish to registries (parallel, idempotent)
  # ──────────────────────────────────────────────
  validate-npm:
    name: "Validate npm package (${{ matrix.name }})"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TypeScript SDK
            directory: sdk/typescript
            test_script: test
          - name: create-vellaveto
            directory: packages/create-vellaveto
            test_script: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: ${{ matrix.directory }}
        run: npm run build

      - name: Check npm package contract
        working-directory: ${{ matrix.directory }}
        run: bash ../../scripts/check-npm-package.sh .

      - name: Test
        if: ${{ matrix.test_script != '' }}
        working-directory: ${{ matrix.directory }}
        run: npm run ${{ matrix.test_script }}

  publish-npm:
    name: Publish npm packages
    needs: validate-npm
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @vellaveto-sdk/typescript (idempotent)
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci --ignore-scripts
          npm run build
          bash ../../scripts/check-npm-package.sh .
          EXISTING=$(npm view @vellaveto-sdk/typescript@${{ inputs.version }} version 2>/dev/null || echo "")
          if [ "$EXISTING" = "${{ inputs.version }}" ]; then
            echo "::notice::@vellaveto-sdk/typescript@${{ inputs.version }} already published — skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Publish create-vellaveto (idempotent)
        working-directory: packages/create-vellaveto
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci --ignore-scripts
          npm run build
          bash ../../scripts/check-npm-package.sh .
          EXISTING=$(npm view create-vellaveto@${{ inputs.version }} version 2>/dev/null || echo "")
          if [ "$EXISTING" = "${{ inputs.version }}" ]; then
            echo "::notice::create-vellaveto@${{ inputs.version }} already published — skipping"
          else
            npm publish --provenance --access public
          fi

  publish-pypi:
    name: Publish Python SDK
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/vellaveto-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Check if version already published
        id: check
        run: |
          STATUS=$(python3 -c "
          import urllib.request, urllib.error, sys
          try:
              urllib.request.urlopen('https://pypi.org/pypi/vellaveto-sdk/${{ inputs.version }}/json')
              print('exists')
          except urllib.error.HTTPError:
              print('new')
          ")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        if: ${{ steps.check.outputs.status == 'new' }}
        run: python -m pip install --require-hashes --no-deps -r sdk/python/requirements-build.txt

      - name: Check Python package contract
        if: ${{ steps.check.outputs.status == 'new' }}
        run: bash scripts/check-python-package.sh sdk/python

      - name: Build package
        if: ${{ steps.check.outputs.status == 'new' }}
        run: cd sdk/python && python -m build --no-isolation

      - name: Upload to PyPI
        if: ${{ steps.check.outputs.status == 'new' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: sdk/python/dist/

      - name: Skip (already published)
        if: ${{ steps.check.outputs.status == 'exists' }}
        run: echo "::notice::vellaveto-sdk ${{ inputs.version }} already on PyPI — skipping"

  publish-maven:
    name: Publish Java SDK
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check if version already published
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://repo1.maven.org/maven2/io/github/paolovella/vellaveto-java-sdk/${{ inputs.version }}/vellaveto-java-sdk-${{ inputs.version }}.pom")
          if [ "$STATUS" = "200" ]; then
            echo "status=exists" >> "$GITHUB_OUTPUT"
          else
            echo "status=new" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: ${{ steps.check.outputs.status == 'new' }}
        working-directory: sdk/java
        run: mvn deploy -B -Prelease -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Skip (already published)
        if: ${{ steps.check.outputs.status == 'exists' }}
        run: echo "::notice::vellaveto-java-sdk ${{ inputs.version }} already on Maven Central — skipping"

  publish-docker:
    name: Publish Docker image
    needs: preflight
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy scan results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: trivy-results.sarif

  # ──────────────────────────────────────────────
  # Phase 4: Provenance and SBOM
  # ──────────────────────────────────────────────
  provenance-sbom:
    name: Provenance and SBOM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true

      - name: Build release artifacts
        run: cargo build --release --workspace --locked

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vellaveto-sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Attest release binaries provenance
        if: ${{ github.event.repository.private == false || vars.ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            target/release/vellaveto
            target/release/vellaveto-proxy
            target/release/vellaveto-http-proxy
            target/release/vellaveto-shield

      - name: Verify provenance attestations
        if: ${{ github.event.repository.private == false || vars.ENABLE_ATTESTATIONS == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in \
            target/release/vellaveto \
            target/release/vellaveto-proxy \
            target/release/vellaveto-http-proxy \
            target/release/vellaveto-shield; do
            if [ ! -f "$artifact" ]; then
              echo "::error::Expected build artifact missing: $artifact"
              exit 1
            fi
            gh attestation verify "$artifact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners \
              >/dev/null
          done

  # ──────────────────────────────────────────────
  # Phase 5: Tag + GitHub Release (LAST — only after everything succeeds)
  # ──────────────────────────────────────────────
  tag-and-release:
    name: Create Tag & GitHub Release
    needs: [build, publish-npm, publish-pypi, publish-maven, publish-docker, provenance-sbom]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum vellaveto-*.tar.gz > checksums-sha256.txt

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vellaveto-sbom

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create Go SDK tag
        run: |
          git tag -a "sdk/go/v${{ inputs.version }}" -m "sdk/go/v${{ inputs.version }}"
          git push origin "sdk/go/v${{ inputs.version }}"
        continue-on-error: true

      - name: Request Go proxy indexing
        run: |
          MODULE="github.com/paolovella/vellaveto/sdk/go"
          VERSION="v${{ inputs.version }}"
          curl -sf "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info" || true
          curl -sf "https://sum.golang.org/lookup/${MODULE}@${VERSION}" || true
        continue-on-error: true

      - name: Extract changelog for this version
        run: |
          VERSION="${{ inputs.version }}"
          awk "/^## \[${VERSION}\]/{found=1;next} /^## \[/{if(found)exit} found{print}" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ inputs.version }}
          body_path: release-notes.md
          files: |
            vellaveto-*.tar.gz
            checksums-sha256.txt
            sbom.cdx.json
          fail_on_unmatched_files: false
          generate_release_notes: false

  # ──────────────────────────────────────────────
  # Dry-run summary
  # ──────────────────────────────────────────────
  dry-run-summary:
    name: Dry Run Summary
    needs: [preflight, build, validate-npm]
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Dry Run Complete"
            echo ""
            echo "Version **${{ inputs.version }}** passed all pre-flight checks, npm package validation, and built successfully on 4 platforms."
            echo ""
            echo "To publish for real:"
            echo '```'
            echo "gh workflow run release.yml -f version=${{ inputs.version }} -f dry_run=false"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
