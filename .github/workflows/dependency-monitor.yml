name: Dependency Monitor

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

permissions: {}

jobs:
  dependency-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Install dependency monitor tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.19.8 --locked
          cargo install cargo-vet --version 0.10.2 --locked
      - name: Run dependency monitor
        run: |
          chmod +x scripts/run-dependency-monitor.sh
          scripts/run-dependency-monitor.sh target/security
      - name: Upload dependency telemetry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-monitor-logs
          path: target/security
